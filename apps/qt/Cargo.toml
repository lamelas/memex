[package]
name = "memex-qt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Native Qt Quick companion for Memex"
default-run = "memex-qt"

[features]
test-support = []

[dependencies]
qtbridge = { git = "https://github.com/qt/qtbridge-rust", rev = "b27aac471757f6fb3a4bc48279a9bf55b8a71f53", features = ["serde_json"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"

[build-dependencies]
qt-build-utils = "=0.10.0"

[dev-dependencies]
quicktest = { git = "https://github.com/qt/qtbridge-rust", rev = "b27aac471757f6fb3a4bc48279a9bf55b8a71f53" }

[[bin]]
name = "memex-qt-fixture"
path = "tests/support/fixture_cli.rs"
required-features = ["test-support"]

[[test]]
name = "ui"
path = "tests/ui.rs"
harness = false
required-features = ["test-support"]
